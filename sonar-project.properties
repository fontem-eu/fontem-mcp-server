sonar.projectKey=gmr-mcp-server
sonar.projectName=gmr-mcp-server
sonar.sources=src
sonar.tests=tests
sonar.exclusions=src/index.js,claude-proxy.py
# src/** used to be excluded wholesale, which is why this project
# reported no coverage at all and sailed through any coverage gate:
# SonarQube skips a condition whose metric has no value. Keep only
# the entrypoint excluded (it is wiring, exercised by the e2e path).
sonar.coverage.exclusions=src/index.js
sonar.javascript.lcov.reportPaths=lcov.info
