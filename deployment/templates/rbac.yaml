apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-proxy
  namespace: gmr

---
# Allow the proxy to update its own credential Secret after OAuth refresh.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claude-proxy-secret-writer
  namespace: gmr
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["claude-credentials"]
    verbs: ["get", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-proxy-secret-writer
  namespace: gmr
subjects:
  - kind: ServiceAccount
    name: claude-proxy
    namespace: gmr
roleRef:
  kind: Role
  name: claude-proxy-secret-writer
  apiGroup: rbac.authorization.k8s.io
