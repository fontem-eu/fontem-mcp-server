apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-proxy
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate  # ReadWriteOnce PVC + OAuth state: don't run two pods at once
  selector:
    matchLabels:
      app: claude-proxy
  template:
    metadata:
      labels:
        app: claude-proxy
        kube-monkey/enabled: enabled
        kube-monkey/identifier: claude-proxy
        kube-monkey/mtbf: "2"
        kube-monkey/kill-mode: fixed
        kube-monkey/kill-value: "1"
    spec:
      serviceAccountName: claude-proxy
      imagePullSecrets:
        - name: regcred
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: claude-home
          persistentVolumeClaim:
            claimName: claude-proxy-home
        - name: claude-creds
          secret:
            secretName: claude-credentials
            items:
              - key: credentials.json
                path: credentials.json
      containers:
        - name: proxy
          image: contribute.void42.internal/golden/gmr-mcp-server:{{ .Values.version }}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: HOME
              value: /claude-home
            - name: GMR_API_URL
              value: {{ .Values.gmrApiUrl }}
            - name: MCP_SERVER_PATH
              value: /app/src/index.js
            - name: CLAUDE_CLI_PATH
              value: /usr/local/bin/claude
          volumeMounts:
            - name: claude-home
              mountPath: /claude-home
            - name: claude-creds
              mountPath: /run/secrets/claude
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1"
