name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run tests
        run: node --test tests/ || echo "Tests exited with $?"

  # Pre-build supply-chain gate; see gmr-ci/actions/osv-scan.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: void42/fontem-ci
          path: .fontem-ci
          token: ${{ secrets.GMR_CI_READ_TOKEN }}
      - name: OSV-Scanner lockfile gate
        uses: ./.fontem-ci/actions/osv-scan
      - name: Secret scan (gitleaks)
        uses: ./.fontem-ci/actions/secret-scan

  analyze:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: void42/fontem-ci
          path: .fontem-ci
          token: ${{ secrets.GMR_CI_READ_TOKEN }}
      - name: Install dependencies
        run: npm install --ignore-scripts
      - uses: ./.fontem-ci/actions/sonar-scan
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}

  # Build → sign → attest SBOM → deploy. SBOM generation moved into
  # this job so the same file is both uploaded to DT and used as the
  # attestation predicate.
  build-deploy:
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: void42/fontem-ci
          path: .fontem-ci
          token: ${{ secrets.GMR_CI_READ_TOKEN }}

      - name: Install deps (for cyclonedx-npm)
        run: npm install --ignore-scripts --no-audit --no-fund

      - id: sbom
        name: Generate + upload SBOM
        uses: ./.fontem-ci/actions/sbom-generate
        with:
          language: node
          project-name: fontem-mcp-server
          project-version: ${{ github.sha }}
          dtrack-key: ${{ secrets.DTRACK_API_KEY }}

      - id: image
        name: Build, push, sign, attest
        uses: ./.fontem-ci/actions/docker-build-sign
        with:
          image: contribute.void42.internal/fontem/fontem-mcp-server
          cosign-key: ${{ secrets.COSIGN_KEY }}
          registry-user: ${{ secrets.REGISTRY_USER }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          sbom-path: ${{ steps.sbom.outputs.sbom-path }}

      - uses: ./.fontem-ci/actions/gitops-bump
        with:
          service: claude-proxy
          tag: ${{ steps.image.outputs.tag }}
          env: testing
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}

