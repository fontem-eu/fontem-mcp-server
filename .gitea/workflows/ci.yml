name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          # Pin Node 22 so the runner's bundled node version doesn't
          # leak into the build. fontem-web hit this when vite 8 needed
          # >=20.19 for `node:util` styleText — the bundled node was
          # older and the suite crashed at startup.
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run tests
        run: npm test

  # Pre-build supply-chain gate; see ci-actions/actions/osv-scan.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: void42/ci-actions
          path: .ci-actions
          token: ${{ secrets.CI_READ_TOKEN }}
      - name: OSV-Scanner lockfile gate
        uses: ./.ci-actions/actions/osv-scan
      - name: Secret scan (gitleaks)
        uses: ./.ci-actions/actions/secret-scan

  analyze:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: void42/ci-actions
          path: .ci-actions
          token: ${{ secrets.CI_READ_TOKEN }}
      - name: Install dependencies
        run: npm install --ignore-scripts
      - uses: ./.ci-actions/actions/sonar-scan
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}

  # Build → sign → attest SBOM → deploy. SBOM generation moved into
  # this job so the same file is both uploaded to DT and used as the
  # attestation predicate.
  build-deploy:
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: void42/ci-actions
          path: .ci-actions
          token: ${{ secrets.CI_READ_TOKEN }}

      - name: Install deps (for cyclonedx-npm)
        run: npm install --ignore-scripts --no-audit --no-fund

      - id: sbom
        name: Generate + upload SBOM
        uses: ./.ci-actions/actions/sbom-generate
        with:
          language: node
          project-name: fontem-mcp-server
          project-version: ${{ github.sha }}

      - id: image
        name: Build, push, sign, attest
        uses: ./.ci-actions/actions/docker-build-sign
        with:
          image: contribute.void42.internal/fontem/fontem-mcp-server
          cosign-key: ${{ secrets.COSIGN_KEY }}
          registry-user: ${{ secrets.REGISTRY_USER }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          sbom-path: ${{ steps.sbom.outputs.sbom-path }}

      # Inline gitops-bump. void42/ci-actions's gitops-bump was
      # rewritten for the void42-templates layout
      # (environments/<env>/image-tag.yaml) that doesn't match
      # fontem/gitops's testing/<svc>.yaml layout. Same shape as
      # the consolidator + sinks + fontem-api workflows.
      - name: Bump claude-proxy image tag in gitops/testing
        env:
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf /tmp/gitops
          git clone --depth=1 \
            "https://${{ secrets.REGISTRY_USER }}:${{ secrets.REGISTRY_PASSWORD }}@contribute.void42.internal/fontem/gitops.git" \
            /tmp/gitops
          cd /tmp/gitops
          sed -i 's/version: ".*"/version: "'"$TAG"'"/' testing/claude-proxy.yaml
          git config user.name "GMR CI"
          git config user.email "ci@void42.internal"
          git add testing/claude-proxy.yaml
          if git diff --cached --quiet; then
            echo "No version change; skipping commit"
            exit 0
          fi
          git commit -m "ci: deploy claude-proxy $TAG to testing"
          git push origin main

