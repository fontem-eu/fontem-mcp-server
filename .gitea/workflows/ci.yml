name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ls -la && cat package.json | head -5
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: node --test tests/
