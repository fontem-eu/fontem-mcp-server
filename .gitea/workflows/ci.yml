name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run tests
        run: node --test tests/ || echo "Tests exited with $?"
